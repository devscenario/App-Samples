# Element centres on the iPhone 17 Pro (402x874 pt), the same in both iOS samples.
appId: ${APP_ID}
---
- swipe: {start: "14%,47%", end: "50%,34%", duration: 40}   # Alpha -> Drop Zone
- assertVisible: ".*Alpha dropped in zone.*"
- swipe: {start: "36%,47%", end: "50%,34%", duration: 40}   # Beta -> Drop Zone
- assertVisible: ".*Beta dropped in zone.*"
- swipe: {start: "60%,47%", end: "50%,34%", duration: 40}   # Gamma -> Drop Zone
- assertVisible: ".*Gamma dropped in zone.*"
- swipe: {start: "21%,61%", end: "21%,68%", duration: 40}   # Row One -> Row Two
- assertVisible: ".*moved.*"
- swipe: {start: "23%,75%", end: "21%,61%", duration: 40}   # Row Three -> Row Two (now first)
- assertVisible: ".*moved.*"
