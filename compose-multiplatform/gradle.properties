kotlin.code.style=official
# Linking the iOS framework needs the room: material-icons-extended is enormous.
kotlin.daemon.jvmargs=-Xmx6g
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.workers.max=4
android.dexingMaxMemory=3g
# The klib cache runs out of heap on material-icons-extended and only speeds up the build.
kotlin.native.cacheKind.iosArm64=none
kotlin.native.cacheKind.iosSimulatorArm64=none
